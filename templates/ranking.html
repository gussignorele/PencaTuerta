{% extends "base.html" %}

{% block content %}

<h2 style="margin-bottom:15px;">Ranking 🏆</h2>

<div style="
    font-size:12px;
    color:#ccc;
    margin-bottom:10px;
    text-align:center;
">
    👉 Clickeá en un usuario para ver sus predicciones
</div>

{% for user, avatar, pts in ranking %}
    <div style="
        padding:15px;
        border-radius:10px;
        margin-bottom:10px;
        display:flex;
        justify-content:space-between;
        align-items:center;

        {% if user == current_user %}
            background:#7c4dff;
        {% else %}
            background:#6c3bb8;
        {% endif %}
    ">

<a href="/user/{{user}}" style="
    display:flex;
    align-items:center;
    gap:12px;
    color:white;
    text-decoration:none;
    font-size:16px;
    font-weight:bold;
    flex:1;
    padding:5px;
    border-radius:8px;
    transition: all 0.2s ease;
"
onmouseover="this.style.background='#7c4dff'"
onmouseout="this.style.background='transparent'"
>

            <!-- medalla -->
            <div style="font-size:20px; width:30px;">
                {% if loop.index == 1 %}🥇
                {% elif loop.index == 2 %}🥈
                {% elif loop.index == 3 %}🥉
                {% endif %}
            </div>

            <!-- avatar -->
            <img src="/static/img/{{ avatar if avatar else 'default_m.png' }}"
                 width="40"
                 style="border-radius:50%;">

            <!-- usuario -->
            <div>{{user}}</div>

        </a>

        <!-- DERECHA (puntos) -->
        <b style="font-size:16px;">{{pts}} pts</b>

    </div>
{% endfor %}

{% endblock %}
