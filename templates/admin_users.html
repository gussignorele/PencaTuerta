{% extends "base.html" %}

{% block content %}

<h2>Usuarios registrados</h2>

<table border="1">
  <tr>
    <th>Usuario</th>
    <th>Celular</th>
  </tr>

  {% for u in users %}

    <td>{{ u[0] }}</td>

</table>

<br>
<a href="/matches">Volver</a>

{% endblock %}
