{% extends "base.html" %}

{% block content %}

<h2 style="text-align:center; margin-bottom:20px;">
📚 Histórico por fecha
</h2>

{% for h in history %}

<div style="
    background:#6c3bb8;
    padding:15px;
    border-radius:10px;
    margin-bottom:12px;
">

    <div style="font-size:18px; font-weight:bold;">
        📅 Fecha {{h.fecha}}
    </div>

    <div style="margin-top:8px;">
        🏆
        {% for g in h.ganadores %}
            <b>{{g}}</b>{% if not loop.last %}, {% endif %}
        {% endfor %}
        — {{h.puntos}} pts
    </div>

</div>

{% endfor %}

{% endblock %}
