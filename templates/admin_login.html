{% extends "base.html" %}

{% block content %}

<h3 style="text-align:center; margin-bottom:20px;">Acceso Admin</h3>

<form method="post" style="
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
">

    <input type="password" name="password"
           placeholder="Password"
           style="
               width:220px;
               padding:10px;
               border:none;
               border-radius:6px;
               text-align:center;
               font-size:14px;
           ">

    <button type="submit" style="
        width:220px;
        padding:10px;
        background:#4a1f6b;
        color:white;
        border:none;
        border-radius:6px;
        font-weight:bold;
    ">
        Entrar
    </button>

</form>

{% endblock %}
