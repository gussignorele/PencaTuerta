{% extends "base.html" %}

{% block content %}

<h2 style="margin-bottom:15px;">Cargar Resultados</h2>
    <!-- 🔥 SELECTOR DE FECHA -->
<form method="get" style="text-align:center; margin-bottom:15px;">

    <select name="fecha"
            onchange="this.form.submit()"
            style="padding:8px; border-radius:6px;">

        {% for f in fechas %}
            <option value="{{f}}" {% if fecha_sel == f %}selected{% endif %}>
                Fecha {{f}}
            </option>
        {% endfor %}

    </select>

</form>

<div style="
    text-align:center;
    font-size:12px;
    color:#ddd;
    margin-bottom:10px;
">
    Mostrando Fecha {{fecha_sel}}
</div>
<form action="/admin/reset_results" method="post"
      onsubmit="return confirm('¿Borrar TODOS los resultados cargados?');"
      style="margin-bottom:15px;">
<input type="hidden" name="fecha" value="{{fecha_sel}}">
    <button style="
        width:100%;
        padding:10px;
        border:none;
        border-radius:6px;
        background:#ff4d4d;
        color:white;
        font-weight:bold;
    ">
        🗑️ Borrar todos los resultados
    </button>

</form>
<div style="display:flex; flex-direction:column; gap:12px;">

{% for m in matches %}

<form method="post" style="
    background:#7c4dff;
    color:white;
    border-radius:10px;
    padding:15px;
">
<input type="hidden" name="fecha" value="{{fecha_sel}}">
    <input type="hidden" name="match_id" value="{{m[0]}}">

    <!-- EQUIPOS -->
    <div style="
        display:grid;
        grid-template-columns: 1fr auto 1fr;
        align-items:center;
        text-align:center;
    ">

        <div>
            <img src="/static/img/{{ logos.get(m[1], 'default.png') }}" width="32"><br>
            <div>{{m[1]}}</div>
        </div>

        <div style="font-weight:bold;">vs</div>

        <div>
            <img src="/static/img/{{ logos.get(m[2], 'default.png') }}" width="32"><br>
            <div>{{m[2]}}</div>
        </div>

    </div>

    <!-- FECHA -->
    <div style="color:#ddd; font-size:12px; margin-top:5px; text-align:center;">
        Fecha {{m[4]}}
    </div>

    <!-- RESULTADO -->
    <div style="
        display:grid;
        grid-template-columns: 1fr auto 1fr;
        align-items:center;
        text-align:center;
        gap:10px;
        margin-top:10px;
    ">

        <input type="number"
               name="goles_local"
               value="{{m[5] if m[5] is not none else ''}}"
               min="0"
               required
               style="width:60px; padding:8px; text-align:center; margin:auto;">

        <div style="font-weight:bold;">-</div>

        <input type="number"
               name="goles_visitante"
               value="{{m[6] if m[6] is not none else ''}}"
               min="0"
               required
               style="width:60px; padding:8px; text-align:center; margin:auto;">

    </div>

    <button type="submit" style="
        margin-top:12px;
        width:100%;
        padding:10px;
        border:none;
        border-radius:5px;
        background:white;
        color:#5a2a83;
        font-weight:bold;
    ">
        Guardar resultado
    </button>

</form>

{% endfor %}

</div>

{% endblock %}
