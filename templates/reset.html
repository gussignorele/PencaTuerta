{% extends "base.html" %}
{% block content %}

<h2 style="margin-bottom:15px;">Nueva contraseña</h2>

<form method="post">

    <input type="password" name="password" placeholder="Nueva contraseña" required minlength="8"
           style="width:100%; padding:12px; margin-bottom:12px; border-radius:6px; border:none; font-size:16px; box-sizing:border-box;">

    <button type="submit" style="
        width:100%;
        padding:12px;
        border:none;
        border-radius:6px;
        background:white;
        color:#5a2a83;
        font-weight:bold;
        font-size:16px;
    ">
        Guardar
    </button>

</form>

<br>

<a href="/" style="color:white;">Volver</a>

{% endblock %}
