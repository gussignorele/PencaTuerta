{% extends "base.html" %}
{% block content %}

<h2>Pagos</h2>

<form method="get" style="margin-bottom:15px; text-align:center;">
    <select name="fecha" onchange="this.form.submit()" style="
        padding:8px;
        border-radius:6px;
        border:none;
    ">
        <option value="">Todas las fechas</option>

        {% for f in fechas %}
            <option value="{{f}}" {% if fecha_actual and f|string == fecha_actual %}selected{% endif %}>
                Fecha {{f}}
            </option>
        {% endfor %}
    </select>
</form>

{% if pagos %}

<div class="payments-container">
    {% for p in pagos %}
        <div class="payment-card">
            <div class="payment-user">{{ p[1] }}</div>
            <div class="payment-fecha">Fecha {{ p[2] }}</div>
            <div class="payment-status status-{{ p[3] }}">
                {{ p[3] }}
            </div>
        </div>
    {% endfor %}
</div>

{% else %}
<div style="text-align:center; margin-top:20px;">
    No hay pagos
</div>
{% endif %}

{% endblock %}
