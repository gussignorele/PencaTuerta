{% extends "base.html" %}
{% block content %}

<h2 style="margin-bottom:15px;">Recuperar contraseña</h2>

<form method="post" onsubmit="disableBtn(this)">

    <input type="email" name="email" placeholder="Tu email" required
           style="width:100%; padding:12px; margin-bottom:12px; border-radius:6px; border:none; font-size:16px; box-sizing:border-box;">

    <button id="submitBtn" type="submit" style="
        width:100%;
        padding:12px;
        border:none;
        border-radius:6px;
        background:white;
        color:#5a2a83;
        font-weight:bold;
        font-size:16px;
    ">
        Enviar mail
    </button>

</form>

<br>

<a href="/" style="color:white;">Volver</a>

<!-- 🔥 JS CORRECTAMENTE UBICADO -->
<script>
function disableBtn(form) {
    const btn = form.querySelector("button");

    btn.disabled = true;
    btn.innerText = "Enviando...";
    btn.style.opacity = "0.6";
    btn.style.cursor = "not-allowed";
}
</script>

{% endblock %}
